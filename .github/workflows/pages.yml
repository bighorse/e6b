name: Publish to GitHub Pages

on:
  push:
    branches: [main, master, feature/cx3-flight-computer]
  workflow_dispatch:
  # refresh the US winds aloft (FB) on the site every hour
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test test/*.test.js

      - name: Airport and navaid data (OurAirports)
        run: node tools/build-navdata.js

      - name: Winds aloft (FB)
        continue-on-error: true
        run: node tools/fetch-winds.js

      - name: Push site to gh-pages
        run: |
          site=$(mktemp -d)
          cp -r index.html route.html manifest.webmanifest css js img data "$site"/
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  winds:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch FB into the published site
        run: node tools/fetch-winds.js site

      - name: Commit
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/winds.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Winds aloft $(date -u +%d%H%MZ)"
          git push -q origin gh-pages
