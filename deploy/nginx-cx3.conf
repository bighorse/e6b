# Nginx site for the CX-3 simulator (static files only).
# Install: copy to /etc/nginx/conf.d/cx3.conf, then `nginx -t && systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name _;               # replace with your domain once it has ICP filing

    root /var/www/cx3;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript text/plain image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
